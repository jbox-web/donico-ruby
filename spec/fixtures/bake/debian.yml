---
registry: registry.example.net/debian
image_builder: bake

matrix:

  - version: latest
    distro: bookworm
    archs: ["linux/amd64", "linux/386", "linux/arm64"]
    image_name: bookworm
    tags:
      - "%<version>s"

  - version: latest
    distro: bullseye
    archs: ["linux/amd64", "linux/386", "linux/arm64"]
    image_name: bullseye
    tags:
      - "%<version>s"

  - version: latest
    distro: buster
    archs: ["linux/amd64", "linux/386", "linux/arm64"]
    image_name: buster
    tags:
      - "%<version>s"

  - version: latest
    distro: stretch
    archs: ["linux/amd64", "linux/386", "linux/arm64"]
    image_name: stretch
    tags:
      - "%<version>s"

  - version: latest
    distro: jessie
    archs: ["linux/amd64", "linux/386"]
    image_name: jessie
    tags:
      - "%<version>s"

  - version: latest
    distro: wheezy
    archs: ["linux/amd64", "linux/386"]
    image_name: wheezy
    tags:
      - "%<version>s"

  - version: latest
    distro: squeeze
    archs: ["linux/amd64", "linux/386"]
    image_name: squeeze
    tags:
      - "%<version>s"

  - version: latest
    distro: lenny
    archs: ["linux/amd64", "linux/386"]
    image_name: lenny
    tags:
      - "%<version>s"
