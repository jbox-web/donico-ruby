---
registry: registry.example.net/images/base
image_name: foo
matrix:
  - version: 1.0.0
    distro: buster
    archs: ["linux/amd64"]
    dockerfile: foo/Dockerfile
    build_args:
      - NODEJS_VERSION=14.17.3
    test_args:
      - RUBYGEM_VERSION=3.2.24
    tags:
      - latest
      - "%<version>s"
      - "%<version>s-%<distro>s"
      - "%<timestamp>s-%<distro>s"
      - "%<version>s-%<timestamp>s-%<distro>s"
      - "%<version>s-%<timestamp>s-%<distro>s-%<arch>s"
