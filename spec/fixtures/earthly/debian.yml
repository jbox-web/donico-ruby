---
registry: registry.example.net/debian
# image_name: alertmanager
image_builder: earthly
earthly_version: 0.7

matrix:

  - version: latest
    distro: bookworm
    archs: ["amd64", "386", "arm64"]
    image_name: bookworm
    tags:
      - "%<version>s"

  - version: latest
    distro: bullseye
    archs: ["amd64", "386", "arm64"]
    image_name: bullseye
    tags:
      - "%<version>s"

  - version: latest
    distro: buster
    archs: ["amd64", "386", "arm64"]
    image_name: buster
    tags:
      - "%<version>s"

  - version: latest
    distro: stretch
    archs: ["amd64", "386", "arm64"]
    image_name: stretch
    tags:
      - "%<version>s"

  - version: latest
    distro: jessie
    archs: ["amd64", "386"]
    image_name: jessie
    tags:
      - "%<version>s"

  - version: latest
    distro: wheezy
    archs: ["amd64", "386"]
    image_name: wheezy
    tags:
      - "%<version>s"

  - version: latest
    distro: squeeze
    archs: ["amd64", "386"]
    image_name: squeeze
    tags:
      - "%<version>s"

  - version: latest
    distro: lenny
    archs: ["amd64", "386"]
    image_name: lenny
    tags:
      - "%<version>s"
