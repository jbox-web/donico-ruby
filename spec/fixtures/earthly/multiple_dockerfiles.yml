---
registry: registry.example.net/images/base
image_name: ruby
image_builder: earthly
matrix:
  - version: 3.2.0
    distro: bullseye
    archs: ["linux/amd64", "linux/arm64"]
    dockerfile: dockerfiles/3.2/Dockerfile
    build_args:
      - NODEJS_VERSION=14.17.3
    tags:
      - "latest-%<distro>s"
      - "%<version>s-%<distro>s"

  - version: 3.1.3
    distro: buster
    archs: ["linux/amd64"]
    dockerfile: dockerfiles/3.1/Dockerfile
    build_args:
      - NODEJS_VERSION=14.17.3
    tags:
      - "latest-%<distro>s"
      - "%<version>s-%<distro>s"
