---
.default:
  image: harbor.jbox-cloud.fr/jbox/base/donico:latest

  # Only use Gitlab runners with "dind" (Docker in Docker) tag
  tags:
    - dind

  # Tasks are namespaced dev:* so they can never be shadowed by a mise subcommand.
  # A bare `mise deps` resolved to mise's own experimental `deps` subcommand,
  # which reported "All dependencies are up to date" without running bundle
  # install, and every job then died on Bundler::GemNotFound.
  script:
    - mise dev:deps
    - mise dev:$CI_JOB_NAME

stages:
  - lint
  - test
  - build
  - push

lint-commits:
  extends: .default
  stage: lint
  # Runs commitlint in its own container, so it needs no bundle
  script:
    - mise dev:$CI_JOB_NAME

lint-project:
  extends: .default
  stage: lint

test:
  extends: .default
  stage: test

build:
  extends: .default
  stage: build
  needs:
    - test
  # Save the generated gem as a job artifact
  artifacts:
    expire_in: 6 mos
    paths:
      - "pkg/*.gem"

push:
  extends: .default
  stage: push
  before_script:
    - |
      mkdir -p ~/.gem
      echo -e "---\n${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems: '${CI_JOB_TOKEN}'" > ~/.gem/credentials
      chmod 600 ~/.gem/credentials
  needs:
    - build
  # Run this job only when pushing a new tag
  only:
    - tags
