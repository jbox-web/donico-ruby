---
lint-commits:
  # We can't access to $DOCKER_ARCH and $DOCKER_DISTRO here because
  # the GitlabCI matrix is not loaded
  # Anyway we don't care since it's just about mounting the current dir
  # inside commitlint container and run commitlint
  image: harbor.jbox-cloud.fr/jbox/base/donico:latest

  # Only use Gitlab runners with "dind" (Docker in Docker) tag
  tags:
    - dind

  stage: lint

  script:
    # The donico image ships its own toolchain: a mise.toml left in the project
    # would try to provision a second one inside the job. -f because most consumer
    # repos have no mise.toml at all, and a missing file must not fail the lint.
    - rm -f mise.toml
    - rake $CI_JOB_NAME
