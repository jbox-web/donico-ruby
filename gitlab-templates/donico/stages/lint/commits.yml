---
lint-commits:
  # We can't access to $DOCKER_ARCH and $DOCKER_DISTRO here because
  # the GitlabCI matrix is not loaded
  # Anyway we don't care since it's just about mounting the current dir
  # inside commitlint container and run commitlint
  image: harbor.thetuxhouse.org/jbox/base/donico:latest

  # Only use Gitlab runners with "dind" (Docker in Docker) tag
  tags:
    - dind

  stage: lint

  script:
    # No `rm -f mise.toml` here anymore: the lint tasks now tell the linter
    # container to ignore the project's mise config, so the file can stay.
    # Deleting a tracked file just to run a lint was a workaround, not a fix.
    - rake $CI_JOB_NAME
