[tools]
ruby = "3.4.9"
shellcheck = "0.11.0"

[settings.ruby]
compile = false

[vars]
# Gem config
GITLAB_PACKAGE_REGISTRY = "https://gitlab.thetuxhouse.org/api/v4/projects/63/packages/rubygems"

# Dev tools config
COMMIT_LINTER = "harbor.jbox-cloud.fr/jbox/base/commitlint:latest"

[tasks."dev:deps"]
description = "Install dependencies"
run = "bundle install"

[tasks."dev:test"]
description = "Run RSpec"
run = "bin/rspec"

[tasks."dev:build"]
description = "Build Donico gem"
run = "bin/rake build DONICO_RELEASE=true"

[tasks."dev:push"]
description = "Push Donico gem"
run = "bin/push"

[tasks."dev:lint-commits"]
description = "Lint commits"
run = '''
docker run --pull always --rm -v "${PWD}:/app" {{vars.COMMIT_LINTER}} bash -l -c 'mise trust -y && commitlint /app && echo "Commits are OK!"'
'''

[tasks."dev:lint-project"]
description = "Lint project"
run = "bin/rubocop"

[tasks.lint-shell]
description = "Lint shell scripts"
# -x follows the sourced library so exe/inspec is checked against it
run = "shellcheck -x bash/*.sh exe/inspec bin/push"
