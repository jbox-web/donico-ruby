# Per-task `timeout` keys are only enforced reliably from mise 2026.10.2 on:
# an older mise must refuse to run instead of leaving those tasks unbounded.
min_version = "2026.10.2"

[tools]
ruby = "3.4.10"
shellcheck = "0.11.0"

[settings.ruby]
compile = false

[vars]
# Gem config
GITLAB_PACKAGE_REGISTRY = "https://gitlab.thetuxhouse.org/api/v4/projects/63/packages/rubygems"

# Dev tools config
COMMIT_LINTER = "harbor.thetuxhouse.org/jbox/base/commitlint:latest"

[tasks."dev:deps"]
description = "Install dependencies"
run = "bundle install"

[tasks."dev:test"]
description = "Run RSpec"
timeout = "600s"
run = "bin/rspec"

[tasks."dev:build"]
description = "Build Donico gem"
run = "bin/rake build DONICO_RELEASE=true"

[tasks."dev:push"]
description = "Push Donico gem"
run = "bin/push"

[tasks."dev:lint-commits"]
description = "Lint commits"
# The range is explicit. `commitlint /app` only ever worked by accident: the
# positional argument is ignored, and up to commitlint 12 a bare invocation fell
# back to linting the whole history. From v13 on it reads stdin instead — closed
# in CI — so it lints the empty string and fails on every commit. The linter
# image now ships 21.2.1, where the old form is rejected outright.
#
# The base follows the pipeline and is checked against the clone first: GitLab
# names a commit without promising the runner has it, and after an amend or a
# force-push that SHA is no longer on the branch. See Donico::CommitRange, which
# this mirrors for the gem's own repository.
#
# MISE_IGNORED_CONFIG_PATHS replaces the `mise trust -y`: the linter image is
# mise-based and would otherwise parse this very file, written for a newer mise
# than it ships, and abort before commitlint runs.
run = '''
base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
case "${base}" in "" | 0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
git cat-file -e "${base}^{commit}" 2>/dev/null || base="HEAD~1"
docker run --pull always --rm \
  -e MISE_IGNORED_CONFIG_PATHS=/app/mise.toml \
  -v "${PWD}:/app" {{vars.COMMIT_LINTER}} \
  commitlint --from "${base}" --to HEAD --verbose
'''

[tasks."dev:lint-project"]
description = "Lint project"
timeout = "180s"
run = "bin/rubocop"

[tasks."dev:lint-shell"]
description = "Lint shell scripts"
# -x follows the sourced library so exe/inspec is checked against it
timeout = "120s"
run = "shellcheck -x bash/*.sh exe/inspec bin/push"
